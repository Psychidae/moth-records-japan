name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No environment or secrets: this job also runs safely for fork PRs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:schema-smoke
      - run: pnpm import:listmj
      - run: pnpm import:listmj-annotations
      - run: pnpm import:regions
      - run: pnpm build:public-data --seed --output generated/public-ci
      - name: Install local PostgreSQL and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo pg_ctlcluster 16 main start || sudo pg_ctlcluster 16 main status
      - name: Verify permissions on real PostgreSQL
        run: sudo -u postgres bash scripts/test-pgtap.sh
      - run: pnpm build
        env:
          # Explicit check-only baseline; release workflows must supply verified artifacts.
          MOTH_PUBLIC_BOOTSTRAP: '1'
