name: Build public data
run-name: ${{ inputs.recheck_id && format('Recheck {0}', inputs.recheck_id) || 'Build public data' }}
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      readiness_only:
        description: 設定確認のみ行い、実処理は起動しない
        required: false
        default: false
        type: boolean
      recheck_id:
        description: 再開処理の照合用識別子（通常は空欄）
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: public-data-staging-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: ready
        uses: ./.github/actions/require-env
        with:
          required: SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        if: steps.ready.outputs.ready == 'true' && inputs.readiness_only != true
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.ready.outputs.ready == 'true' && inputs.readiness_only != true
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.ready.outputs.ready == 'true' && inputs.readiness_only != true
      # Generates and verifies a staging build. T17 owns distribution/deployment.
      - name: Run configured task
        if: steps.ready.outputs.ready == 'true' && inputs.readiness_only != true
        run: pnpm build:public-data --run
        env:
          SUPABASE_URL: https://zbbmvrmmxhrytwqrjyyk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Explain check-only mode
        if: inputs.readiness_only == true
        run: |
          echo '確認のみ: 実処理を起動していません。' >> "$GITHUB_STEP_SUMMARY"
